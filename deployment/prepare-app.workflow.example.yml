# INACTIVE EXAMPLE. GitHub cannot run workflows outside .github/workflows/.
# Copy only after owner approval, isolated-app infrastructure review and app-origin testing.
# This example prepares an artifact; it contains NO AWS authentication/upload/deploy step.
name: Prepare reviewed isolated app
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: visualnerve-isolated-app-preparation
  cancel-in-progress: false
env:
  SITE_URL: https://www.visualnerve.com
  APP_SURFACE_ORIGIN: https://app.visualnerve.com
  APP_WEBSITE_ORIGIN: https://www.visualnerve.com
  APP_BRIDGE_PORTS: "4317"
  HUGO_PARAMS_ENVIRONMENT: production
  HUGO_PARAMS_GOOGLEANALYTICSMEASUREMENTID: ""
  HUGO_VERSION: "0.148.2"
  APP_SURFACE_APPROVED_SHA: ${{ vars.APP_SURFACE_APPROVED_SHA }}
  APP_SURFACE_STAGING_VERIFIED_SHA: ${{ vars.APP_SURFACE_STAGING_VERIFIED_SHA }}
  APP_S3_BUCKET: ${{ vars.APP_S3_BUCKET }}
  APP_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.APP_CLOUDFRONT_DISTRIBUTION_ID }}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: app-production
      url: https://app.visualnerve.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require separate app review and verification for this exact main commit
        run: node deployment/require-app-approval.mjs
      - name: Preserve the existing exact-commit production approval, CI and staging gates
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVED_SHA: ${{ vars.PRODUCTION_APPROVED_SHA }}
        run: node scripts/require-ci.mjs production
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install checked Hugo build tool
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output hugo-checksums.txt
          grep " $archive$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build source and audited app-only package
        run: |
          ./build.sh
          node scripts/build-app-surface.mjs public public-app
      - name: Recheck app review before releasing the artifact
        run: node deployment/require-app-approval.mjs
      - name: Preserve the isolated surface for reviewed manual publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visualnerve-isolated-app-${{ github.sha }}
          path: public-app/
          if-no-files-found: error
          retention-days: 7
