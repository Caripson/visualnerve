            "minLength": 1,
            "type": "string"
          },
          "mode": {
            "description": "Optional detail level. When omitted, one file uses symbols (declarations and dependencies); multiple files use files (project overview). An explicit files or symbols choice is always preserved. Preview and saved code analysis return the resolved mode.",
            "enum": [
              "files",
              "symbols"
            ],
            "type": "string"
          },
          "name": {
            "maxLength": 500,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "files"
        ],
        "type": "object"
