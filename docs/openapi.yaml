          "decisions": {
            "items": {
              "$ref": "#/components/schemas/BuildDecision"
            },
            "maxItems": 200,
            "type": "array"
          },
          "nodeCount": {
            "type": "integer"
          },
          "omittedDecisions": {
            "type": "integer"
          },
          "sections": {
            "additionalProperties": false,
            "properties": {
              "acceptanceCriteria": {
                "type": "string"
              },
              "apiContract": {
                "type": "string"
              },
              "businessRules": {
                "type": "string"
              },
              "dataModel": {
                "type": "string"
              },
              "decisions": {
                "type": "string"
              },
              "screens": {
                "type": "string"
              }
            },
            "required": [
              "dataModel",
              "screens",
              "businessRules",
              "apiContract",
              "acceptanceCriteria",
              "decisions"
            ],
            "type": "object"
          },
          "unresolved": {
            "type": "integer"
          },
          "version": {
            "enum": [
              1
            ],
            "type": "integer"
          }
        },
        "required": [
          "version",
          "sections",
          "decisions",
          "unresolved",
          "omittedDecisions",
          "nodeCount"
        ],
        "type": "object"
      },
