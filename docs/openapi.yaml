      "DiagramFileInput": {
        "additionalProperties": false,
        "description": "drawio data is XML text (.drawio/.xml); vsdx data is strict padded standard base64 containing a ZIP archive (.vsdx). No URLs, scripts, images or macros are fetched or executed. Legacy .vsd and macro-enabled .vsdm are unsupported. Absolute decoded file ceiling 1 GiB. Expanded data ceiling is min(1 GiB, max(100 MiB, 2 * selected file limit)); default 100 MiB. Other limits: 2,048 ZIP entries, 100 pages, 20,000 total objects, 40,000 total relationships, hierarchy depth 256. Browser worker deadline 30 seconds; transport allows 45 seconds. Base64 integration files must remain below roughly 24 MiB to fit the JSON envelope. The connected browser applies its saved local import file size limit: default 50 MiB, configurable from 50 to 1024 MiB (1 GiB) in Settings. UI MB means MiB and UI 1 GB means 1024 MiB. Only imports up to 50 MB are supported and guaranteed; higher limits are experimental and may be slow or fail because of browser memory or format limits. The HTTP/JSON and WebSocket transport envelopes remain 32 MiB and are not increased by this setting.",
