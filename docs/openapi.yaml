      "ApplicationSpecification": {
        "additionalProperties": false,
        "description": "Observed schemas/relationships, clearly proposed screens/read API routes, acceptance criteria and missing decisions. No runtime behavior, unknown schema fields or hidden source records are invented. At most 200 decisions are shown; omittedDecisions counts additional open questions and remains unresolved until a narrower scope is reviewed.",
