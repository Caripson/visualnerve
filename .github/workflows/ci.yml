name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.148.2"

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    # The full encrypted-storage and browser suite also exercises large data,
    # playback and real exports; leave time for dependency installation.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output hugo-checksums.txt
          grep " $archive$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser test dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test and build production application
        run: ./scripts/test.sh --e2e
      - name: Preserve browser test failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
