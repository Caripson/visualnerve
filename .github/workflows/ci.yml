name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.148.2"

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    # The complete encrypted-storage and browser suites take about an hour on
    # a shared machine. Include installation/build headroom; individual test
    # deadlines still detect stalled operations.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output hugo-checksums.txt
          grep " $archive$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Roblox Luau verification tools
        shell: bash
        run: |
          set -euo pipefail
          luau_dir="$RUNNER_TEMP/visualnerve-luau-0.742"
          mkdir -p "$luau_dir"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip \
            --output "$luau_dir/luau-ubuntu.zip"
          echo "152058b98c60ff1f5b5ec9bca0b8eb37793cae161dd3a05608cc3d8738ba1a4d  $luau_dir/luau-ubuntu.zip" | sha256sum --check --strict
          unzip -q "$luau_dir/luau-ubuntu.zip" -d "$luau_dir"
          chmod +x "$luau_dir/luau" "$luau_dir/luau-compile"
          echo "ROBLOX_LUAU_CLI=$luau_dir/luau" >> "$GITHUB_ENV"
          echo "ROBLOX_LUAU_COMPILE=$luau_dir/luau-compile" >> "$GITHUB_ENV"
      - name: Verify generated Roblox grammar and authoritative rules
        working-directory: frontend
        run: npm run verify:roblox-luau
      - name: Install browser test dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test and build production application
        run: ./scripts/test.sh --e2e
      - name: Preserve browser test failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
