name: Collaboration relay checks

on:
  push:
    branches: [main]
    paths:
      - "collaboration-worker/**"
      - ".github/workflows/collaboration-checks.yml"
      - ".github/workflows/deploy-collaboration.yml"
  pull_request:
    branches: [main]
    paths:
      - "collaboration-worker/**"
      - ".github/workflows/collaboration-checks.yml"
      - ".github/workflows/deploy-collaboration.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collaboration-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collaboration-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:setup
      - run: npm run build
