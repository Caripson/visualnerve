name: Deploy production

# Manual promotion only. Repository approval stays unset until owner review.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visualnerve-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: www.visualnerve.com
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID }}
  SITE_URL: https://www.visualnerve.com
  HUGO_PARAMS_ENVIRONMENT: production
  HUGO_PARAMS_GOOGLEANALYTICSMEASUREMENTID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
  HUGO_VERSION: "0.148.2"

jobs:
  deploy:
    name: Promote reviewed revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.visualnerve.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require owner approval, CI and staging for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVED_SHA: ${{ vars.PRODUCTION_APPROVED_SHA }}
        run: node scripts/require-ci.mjs production
      - name: Require configured production distribution
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFRONT_DISTRIBUTION_ID" || "$CLOUDFRONT_DISTRIBUTION_ID" == 'REPLACE_IN_GITHUB' ]]; then
            echo '::error::Set PRODUCTION_CLOUDFRONT_DISTRIBUTION_ID after reviewing the actual www.visualnerve.com AWS distribution. No distribution or certificate is created by this workflow.'
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output hugo-checksums.txt
          grep " $archive$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build static application
        run: ./build.sh
      - name: Require configured deployment credentials
        env:
          DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_ACCESS_KEY_ID" || -z "$DEPLOY_SECRET_ACCESS_KEY" || "$DEPLOY_ACCESS_KEY_ID" == 'REPLACE_IN_GITHUB' || "$DEPLOY_SECRET_ACCESS_KEY" == 'REPLACE_IN_GITHUB' ]]; then
            echo '::error::Set deployment credentials in Actions secrets before deploying.'
            exit 1
          fi
      - name: Recheck approval and verification before AWS access
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_APPROVED_SHA: ${{ vars.PRODUCTION_APPROVED_SHA }}
        run: node scripts/require-ci.mjs production
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "094904000140"
          mask-aws-account-id: true
      - name: Upload reviewed application and wait for CDN invalidation
        run: ./scripts/deploy-static.sh "$S3_BUCKET" "$CLOUDFRONT_DISTRIBUTION_ID"
      - name: Report promotion
        shell: bash
        run: echo "Promoted owner-approved $GITHUB_SHA from staging to $SITE_URL; CloudFront invalidation completed." >> "$GITHUB_STEP_SUMMARY"
