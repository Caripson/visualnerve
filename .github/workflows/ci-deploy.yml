name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep main builds/deployments in order without interrupting an upload.
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: visualnerve.caripson.com
  CLOUDFRONT_DISTRIBUTION_ID: E3PXPDRARNVUFD
  SITE_URL: https://visualnerve.caripson.com
  HUGO_VERSION: '0.148.2'

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$release/hugo_${HUGO_VERSION}_checksums.txt" --output hugo-checksums.txt
          grep " $archive$" hugo-checksums.txt | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install browser test dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test and build production application
        run: ./scripts/test.sh --e2e
      - name: Upload audited application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-application
          path: public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy S3 and invalidate CloudFront
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: visualnerve-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-application
          path: public/
      - name: Require configured deployment credentials
        env:
          DEPLOY_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          DEPLOY_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_ACCESS_KEY_ID" || -z "$DEPLOY_SECRET_ACCESS_KEY" || "$DEPLOY_ACCESS_KEY_ID" == 'REPLACE_IN_GITHUB' || "$DEPLOY_SECRET_ACCESS_KEY" == 'REPLACE_IN_GITHUB' ]]; then
            echo '::error::Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in repository Actions secrets before deploying.'
            exit 1
          fi
      - name: Configure AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '094904000140'
          mask-aws-account-id: true
      - name: Upload application and wait for CDN invalidation
        run: ./scripts/deploy-static.sh "$S3_BUCKET" "$CLOUDFRONT_DISTRIBUTION_ID"
      - name: Verify public pages and HTTP 404
        shell: bash
        run: |
          set -euo pipefail
          for path in / /help/ /privacy/ /license/ /editor/app.js /sw.js; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --output /dev/null "$SITE_URL$path"
          done
          status="$(curl --silent --show-error --retry 3 --output "$RUNNER_TEMP/not-found.html" --write-out '%{http_code}' "$SITE_URL/ci-not-found-${GITHUB_RUN_ID}.html")"
          [[ "$status" == '404' ]]
          grep --fixed-strings --quiet 'Page not found' "$RUNNER_TEMP/not-found.html"
          echo "Deployed $GITHUB_SHA to $SITE_URL; CloudFront invalidation completed and HTTP 404 verified." >> "$GITHUB_STEP_SUMMARY"
