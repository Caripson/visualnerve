name: Usage or documentation question
description: Ask about a workflow or point out unclear documentation.
title: "[Question] "
labels: [question, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        The [Guide](https://www.visualnerve.com/help/) covers normal workflows. For local development or integration, see the [documentation index](https://github.com/Caripson/visualnerve/blob/main/docs/README.md).
        Do not share private diagrams, source files, backups, credentials or raw HAR recordings. Use [SECURITY.md](https://github.com/Caripson/visualnerve/blob/main/SECURITY.md) for vulnerabilities.
  - type: textarea
    id: question
    attributes:
      label: Question or unclear instruction
      description: Explain what you want to do, what you tried and where you got stuck. For documentation, name the page or heading.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment, if relevant
      description: Browser/device, local setup or API/MCP client. Use hostnames without query strings or tokens.
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to publish
      options:
        - label: I removed private data and secrets from this question and its attachments.
          required: true
