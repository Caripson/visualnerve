[package]
name = "visual-nerve-collaboration-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.1", features = ["js"] }
openmls_traits = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_old = { package = "getrandom", version = "0.2.15", features = ["js"] }
zeroize = "1.8"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
